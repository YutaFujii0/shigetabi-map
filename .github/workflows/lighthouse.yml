name: Lighthouse

# ビルドしたサイトを Lighthouse で計測し、スコアが基準を下回ったら失敗にする（基準は lighthouserc.json）
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.15.x autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lhci-report
