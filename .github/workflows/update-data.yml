name: Update data

# YouTube の新着を取得して src/data を更新し、差分があれば PR を作る。人が確認してマージすると Pages が再ビルドされる
on:
  schedule:
    - cron: '17 21 * * *' # 毎日 6:17 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:update
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: npm run build
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data/update
          delete-branch: true
          commit-message: 'データ更新（YouTube）'
          title: 'データ更新（YouTube）'
          body-path: scripts/out/report.md
          add-paths: src/data
