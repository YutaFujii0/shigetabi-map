name: Update data

# YouTube の新着を取得して src/data を更新し、差分があれば PR を作る。人が確認してマージすると Pages が再ビルドされる
on:
  schedule:
    - cron: '17 1-23/4 * * *' # 4時間ごと（JST 2:17・6:17・10:17・14:17・18:17・22:17）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:update
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: npm run build
      - id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/update
          delete-branch: true
          commit-message: 'データ更新（YouTube）'
          title: 'データ更新（YouTube）'
          body-path: scripts/out/report.md
          add-paths: src/data
      # PR を作った・更新した時だけ Slack に知らせる（差分が無い日は何も送らない）
      - if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
        run: |
          if [ "$OPERATION" = created ]; then verb='作りました'; else verb='更新しました'; fi
          jq -n --arg text "YouTube のデータ更新 PR を${verb}。確認してマージしてください: $PR_URL" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
